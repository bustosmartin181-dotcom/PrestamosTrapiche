name: Compilar APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar dependencias web
        run: |
          npm install
          npm run build

      - name: Inicializar Capacitor Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Otorgar permisos a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK en modo Release sin firmar / Debug
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: Mis-Prestamos-App-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
