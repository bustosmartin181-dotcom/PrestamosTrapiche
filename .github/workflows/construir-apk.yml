name: Construir APK
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: construir-apk
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preparar la app (busca index.html con cualquier mayuscula)
        run: |
          F=$(find . -maxdepth 1 -iname 'index.html' | head -1)
          if [ -z "$F" ]; then echo "::error::Falta el archivo index.html en el repositorio"; exit 1; fi
          mkdir -p www assets
          cp "$F" www/index.html
          ls -la www
      - name: Revisar que el codigo no tenga errores
        run: |
          python3 -c "import re;h=open('www/index.html',encoding='utf-8').read();s=re.findall(r'<script>(.*?)</script>',h,re.S);open('/tmp/app.js','w',encoding='utf-8').write(s[-1])"
          node --check /tmp/app.js
      - name: Crear iconos (usa los tuyos si estan en el repo)
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          if [ -f icon-only.png ] && [ -f icon-foreground.png ] && [ -f icon-background.png ]; then
            echo "Usando los iconos del repositorio"
            cp icon-only.png icon-foreground.png icon-background.png assets/
            if [ -f icon-redondo.png ]; then S=icon-redondo.png; else S=icon-only.png; fi
            convert -size 2732x2732 xc:'#F5F1EB' \( "$S" -resize 640x640 \) -gravity center -composite assets/splash.png
            convert -size 2732x2732 xc:'#121614' \( "$S" -resize 640x640 \) -gravity center -composite assets/splash-dark.png
          else
            echo "No hay iconos en el repo: se crean unos simples"
            convert -size 1024x1024 xc:'#1E5FA8' assets/icon-background.png
            convert -size 1024x1024 xc:none -fill white -draw 'circle 512,512 512,212' -fill '#1E5FA8' -draw 'circle 512,512 512,272' -fill white -draw 'circle 512,512 512,342' assets/icon-foreground.png
            convert -size 1024x1024 xc:'#1E5FA8' -fill white -draw 'circle 512,512 512,212' -fill '#1E5FA8' -draw 'circle 512,512 512,272' -fill white -draw 'circle 512,512 512,342' assets/icon-only.png
            convert -size 2732x2732 xc:'#F5F1EB' -fill '#1E5FA8' -draw 'circle 1366,1366 1366,1066' -fill '#F5F1EB' -draw 'circle 1366,1366 1366,1126' -fill '#1E5FA8' -draw 'circle 1366,1366 1366,1196' assets/splash.png
            convert -size 2732x2732 xc:'#121614' -fill '#5AA7F5' -draw 'circle 1366,1366 1366,1066' -fill '#121614' -draw 'circle 1366,1366 1366,1126' -fill '#5AA7F5' -draw 'circle 1366,1366 1366,1196' assets/splash-dark.png
          fi
          ls -la assets
      - run: npm install
      - run: npx cap add android
      - name: Generar iconos de Android
        continue-on-error: true
        run: npx @capacitor/assets generate --android
      - run: npx cap sync android
      - name: Permisos de notificaciones
        run: |
          F=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS $F || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' $F
          grep -q RECEIVE_BOOT_COMPLETED $F || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n</manifest>#' $F
      - name: Numerar la version
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
      - name: Usar siempre la misma clave de firma
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add debug.keystore
            git commit -m "Clave de firma del APK"
            git push
          fi
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - name: Construir APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mis-prestamos-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar el APK en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MisPrestamos.apk
          gh release create "v1.0.${{ github.run_number }}" MisPrestamos.apk --title "Mis préstamos 1.0.${{ github.run_number }}" --notes "APK listo para instalar."
