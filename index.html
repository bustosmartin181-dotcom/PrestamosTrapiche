<script>
/* =====================================================================
   01 · UTILIDADES Y FORMATOS
   ===================================================================== */
const MS_DIA = 864e5;
const dosDigitos = n => String(n).padStart(2, '0');
const pesos = n => (Math.round(n) < 0 ? '-' : '') + '$' + Math.abs(Math.round(n)).toLocaleString('es-AR');
const aNumero = v => +String(v).replace(/\./g, '').replace(',', '.').replace(/[^\d.-]/g, '') || 0;
const escapar = s => String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function numeroDeDia(iso) {
  const [a, m, d] = (iso || '').slice(0, 10).split('-').map(Number);
  return Date.UTC(a, m - 1, d) / MS_DIA;
}
const isoDeNumero = n => new Date(n * MS_DIA).toISOString().slice(0, 10);
function hoyISO() {
  const d = new Date();
  return d.getFullYear() + '-' + dosDigitos(d.getMonth() + 1) + '-' + dosDigitos(d.getDate());
}
const diaYMes = iso => (iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) : '');
const fechaLegible = iso => (iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4) : '');

/* =====================================================================
   02 · MOTOR FINANCIERO Y ESTADO
   ===================================================================== */
const CLAVE_STORAGE = 'mis_prestamos_pro_v1';
const VERSION = '1.1.0';

let S = cargarEstado();

function estadoInicial() {
  return {
    bienvenida: false, // Controla si ya completó la inducción
    cajaInicial: 1000000,
    nombreNegocio: 'Cobranzas & Préstamos',
    clientes: [
      { id: 1, n: 'Juan Pérez', tel: '5491100000000', dni: '32456789', dir: 'Av. San Martín 1234', zona: 'Centro' },
      { id: 2, n: 'María González', tel: '5491111111111', dni: '28765432', dir: 'Belgrano 450', zona: 'Norte' }
    ],
    prestamos: [],
    pagos: [],
    movimientosCaja: []
  };
}

function cargarEstado() {
  let g = null;
  try { g = JSON.parse(localStorage.getItem(CLAVE_STORAGE)); } catch (_) {}
  return g && g.prestamos ? g : estadoInicial();
}

function guardar() {
  try { localStorage.setItem(CLAVE_STORAGE, JSON.stringify(S)); } catch (_) {}
}

function generarCuotas(prestamo) {
  const cuotas = [];
  const n = prestamo.numCuotas;
  const monto = Math.round(prestamo.totalDevolver / n);
  let fechaCursor = numeroDeDia(prestamo.fechaInicio);

  for (let i = 1; i <= n; i++) {
    if (prestamo.frecuencia === 'diario') {
      fechaCursor += 1;
      const diaSem = new Date(fechaCursor * MS_DIA).getUTCDay();
      if (!prestamo.incluyeFinde && (diaSem === 0 || diaSem === 6)) {
        if (diaSem === 6) fechaCursor += 2;
        else if (diaSem === 0) fechaCursor += 1;
      }
    } else if (prestamo.frecuencia === 'semanal') {
      fechaCursor += 7;
    } else if (prestamo.frecuencia === 'quincenal') {
      fechaCursor += 15;
    } else if (prestamo.frecuencia === 'mensual') {
      fechaCursor += 30;
    }
    cuotas.push({
      num: i,
      vence: isoDeNumero(fechaCursor),
      monto: monto,
      pagado: 0
    });
  }
  return cuotas;
}

function calcularMetricas() {
  const hoy = hoyISO();
  let capitalPrestadoTotal = 0;
  let capitalEnLaCalle = 0;
  let totalCobrado = 0;
  let interesesGanadosCobrados = 0;
  let interesesEsperados = 0;
  let cobrosHoyEsperados = 0;
  let cobrosHoyEfectuados = 0;

  const rutaCobroHoy = [];

  S.prestamos.forEach(p => {
    capitalPrestadoTotal += p.montoPrestado;
    interesesEsperados += (p.totalDevolver - p.montoPrestado);

    let pagadoPrestamo = 0;
    (p.plan || []).forEach(cuota => {
      pagadoPrestamo += (cuota.pagado || 0);

      const debe = cuota.monto - (cuota.pagado || 0);
      const esHoy = cuota.vence === hoy;
      const atrasada = cuota.vence < hoy && debe > 0;

      if (esHoy) {
        cobrosHoyEsperados += cuota.monto;
        cobrosHoyEfectuados += (cuota.pagado || 0);
      }

      if (debe > 0 && (esHoy || atrasada)) {
        const cliente = S.clientes.find(c => c.id === p.clienteId) || { n: 'Cliente #' + p.clienteId };
        rutaCobroHoy.push({
          prestamoId: p.id,
          cliente: cliente.n,
          tel: cliente.tel,
          numCuota: cuota.num,
          totalCuotas: p.numCuotas,
          vence: cuota.vence,
          montoCuota: cuota.monto,
          pagado: cuota.pagado || 0,
          saldoCuota: debe,
          esAtraso: atrasada,
          diasAtraso: atrasada ? Math.round(numeroDeDia(hoy) - numeroDeDia(cuota.vence)) : 0
        });
      }
    });

    totalCobrado += pagadoPrestamo;
    capitalEnLaCalle += Math.max(0, p.totalDevolver - pagadoPrestamo);
    
    const ratioInteres = (p.totalDevolver - p.montoPrestado) / (p.totalDevolver || 1);
    interesesGanadosCobrados += pagadoPrestamo * ratioInteres;
  });

  const otrosIngresos = S.movimientosCaja.filter(m => m.tipo === 'ingreso').reduce((a, b) => a + b.monto, 0);
  const otrosEgresos = S.movimientosCaja.filter(m => m.tipo === 'egreso').reduce((a, b) => a + b.monto, 0);

  const cajaDisponible = (S.cajaInicial || 0) - capitalPrestadoTotal + totalCobrado + otrosIngresos - otrosEgresos;

  return {
    cajaDisponible,
    capitalPrestadoTotal,
    capitalEnLaCalle,
    totalCobrado,
    interesesEsperados,
    interesesGanadosCobrados,
    cobrosHoyEsperados,
    cobrosHoyEfectuados,
    rutaCobroHoy: rutaCobroHoy.sort((a,b) => (b.esAtraso ? 1 : 0) - (a.esAtraso ? 1 : 0))
  };
}

/* =====================================================================
   03 · EXPORTACIÓN DIRECTA EXCEL (.xlsx)
   ===================================================================== */
const aBytes = txt => new TextEncoder().encode(txt);
const TABLA_CRC = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = TABLA_CRC[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function juntarBytes(lista) {
  const total = lista.reduce((t, x) => t + x.length, 0), salida = new Uint8Array(total);
  let pos = 0; lista.forEach(x => { salida.set(x, pos); pos += x.length; });
  return salida;
}
function crearZip(archivos) {
  const u16 = n => [n & 255, (n >> 8) & 255];
  const u32 = n => [n & 255, (n >>> 8) & 255, (n >>> 16) & 255, (n >>> 24) & 255];
  const locales = [], centrales = []; let pos = 0;
  archivos.forEach(a => {
    const nombre = aBytes(a.n), crc = crc32(a.d), tam = a.d.length;
    locales.push(Uint8Array.from([].concat(u32(0x04034b50), u16(20), u16(0x0800), u16(0), u16(0), u16(0x21), u32(crc), u32(tam), u32(tam), u16(nombre.length), u16(0))), nombre, a.d);
    centrales.push(Uint8Array.from([].concat(u32(0x02014b50), u16(20), u16(20), u16(0x0800), u16(0), u16(0), u16(0x21), u32(crc), u32(tam), u32(tam), u16(nombre.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(pos))), nombre);
    pos += 30 + nombre.length + tam;
  });
  const central = juntarBytes(centrales);
  const fin = Uint8Array.from([].concat(u32(0x06054b50), u16(0), u16(0), u16(archivos.length), u16(archivos.length), u32(central.length), u32(pos), u16(0)));
  return juntarBytes(locales.concat([central, fin]));
}

function generarExcelPréstamos() {
  const xmlEsc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const filas = [
    ['Mis Préstamos - Cartera de Créditos'],
    ['Cliente', 'DNI', 'Teléfono', 'Capital', 'Interés %', 'Total a Devolver', 'Cobrado', 'Saldo Pendiente', 'Estado']
  ];
  S.prestamos.forEach(p => {
    const cli = S.clientes.find(c => c.id === p.clienteId) || { n: 'Desconocido', dni: '-', tel: '-' };
    const cobrado = (p.plan || []).reduce((a, b) => a + (b.pagado || 0), 0);
    const saldo = Math.max(0, p.totalDevolver - cobrado);
    filas.push([
      cli.n, cli.dni, cli.tel, p.montoPrestado, p.tasa + '%', p.totalDevolver, cobrado, saldo, saldo === 0 ? 'Cancelado' : 'Activo'
    ]);
  });

  const sheetData = filas.map((r, rowIdx) => `<row r="${rowIdx+1}">` + r.map((c, colIdx) => {
    const ref = String.fromCharCode(65 + colIdx) + (rowIdx + 1);
    const esNum = typeof c === 'number';
    return esNum ? `<c r="${ref}"><v>${c}</v></c>` : `<c r="${ref}" t="inlineStr"><is><t>${xmlEsc(c)}</t></is></c>`;
  }).join('') + '</row>').join('');

  const ws = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${sheetData}</sheetData></worksheet>`;
  const wb = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Prestamos" sheetId="1" r:id="rId1"/></sheets></workbook>`;
  const rels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>`;
  const pkgRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;
  const types = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>`;

  const zip = crearZip([
    { n: '[Content_Types].xml', d: aBytes(types) },
    { n: '_rels/.rels', d: aBytes(pkgRels) },
    { n: 'xl/workbook.xml', d: aBytes(wb) },
    { n: 'xl/_rels/workbook.xml.rels', d: aBytes(rels) },
    { n: 'xl/worksheets/sheet1.xml', d: aBytes(ws) }
  ]);

  descargarArchivo('Cartera_Prestamos_' + hoyISO() + '.xlsx', zip, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}

function descargarArchivo(nombre, contenido, tipoMime) {
  const blob = contenido instanceof Uint8Array ? new Blob([contenido], { type: tipoMime }) : new Blob([contenido], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

   ===================================================================== */
function dibujar() {
  const app = document.getElementById('app');
  const nav = document.getElementById('barra-nav');
  const fab = document.getElementById('fab');

  // Si no se completó la bienvenida, muestra la presentación y esconde la barra inferior
  if (!S.bienvenida) {
    nav.style.display = 'none';
    fab.style.display = 'none';
    app.innerHTML = pantallaBienvenida();
    return;
  }

  nav.style.display = '';
  fab.style.display = '';

  document.querySelectorAll('nav button').forEach(b => {
    b.classList.toggle('on', b.dataset.t === UI.pestana);
  });

  const m = calcularMetricas();

  if (UI.pestana === 'cobros') app.innerHTML = renderCobros(m);
  else if (UI.pestana === 'prestamos') app.innerHTML = renderPrestamos(m);
  else if (UI.pestana === 'clientes') app.innerHTML = renderClientes();
  else if (UI.pestana === 'caja') app.innerHTML = renderCaja(m);
  else if (UI.pestana === 'ajustes') app.innerHTML = renderAjustes();

  const pie = document.createElement('div');
  pie.className = 'copyright';
  app.appendChild(pie);
}

function registrarCobro(prestamoId, numCuota, montoRecibido) {
  const p = S.prestamos.find(x => x.id === prestamoId);
  if (!p) return;
  const cuota = (p.plan || []).find(c => c.num === numCuota);
  if (!cuota) return;

  cuota.pagado = (cuota.pagado || 0) + montoRecibido;
  
  const cli = S.clientes.find(c => c.id === p.clienteId) || { n: 'Cliente', tel: '' };

  S.pagos.push({
    id: Date.now(),
    prestamoId,
    clienteId: p.clienteId,
    numCuota,
    monto: montoRecibido,
    fecha: hoyISO()
  });

  guardar();
  dibujar();

  const mensaje = encodeURIComponent(
    `*RECIBO DE PAGO - ${S.nombreNegocio}*\n` +
    `--------------------------------\n` +
    `👤 *Cliente:* ${cli.n}\n` +
    `📅 *Fecha:* ${fechaLegible(hoyISO())}\n` +
    `💵 *Monto Abonado:* ${pesos(montoRecibido)}\n` +
    `🔢 *Cuota:* #${cuota.num} de ${p.numCuotas}\n` +
    `📌 *Saldo Restante Cuota:* ${pesos(Math.max(0, cuota.monto - cuota.pagado))}\n` +
    `--------------------------------\n` +
    `¡Muchas gracias por su pago!`
  );

  abrirModal(`
    <h2>¡Cobro Registrado!</h2>
    <p>Se registraron <b>${pesos(montoRecibido)}</b> para la cuota #${numCuota} de ${escapar(cli.n)}.</p>
    <div class="f">
      ${cli.tel ? `<a href="https://wa.me/${cli.tel.replace(/\D/g,'')}?text=${mensaje}" target="_blank" class="button wa-btn" style="display:block;text-align:center;text-decoration:none;padding:12px;border-radius:999px;font-weight:700;flex:1">Enviar Recibo por WhatsApp</a>` : ''}
      <button class="sec" onclick="cerrarModal()">Listo</button>
    </div>
  `);
}

/* =====================================================================
   09 · DESPACHO DE ACCIONES
   ===================================================================== */
document.addEventListener('click', async e => {
  const btn = e.target.closest('button, [data-a]');
  if (!btn) return;
  const accion = btn.dataset.a;

  /* Navegación por pestañas */
  if (btn.dataset.t) {
    UI.pestana = btn.dataset.t;
    dibujar();
    window.scrollTo(0, 0);
    return;
  }

  /* Acciones de la Presentación (Onboarding) */
  if (accion === 'pasoSiguiente') {
    if (UI.paso === 0) {
      const nom = document.getElementById('introNegocio');
      if (nom && nom.value.trim()) S.nombreNegocio = nom.value.trim();
    }
    if (UI.paso === 4) {
      const cj = document.getElementById('introCaja');
      if (cj) S.cajaInicial = aNumero(cj.value);
    }

    if (UI.paso < 5) {
      UI.paso += 1;
      dibujar();
      window.scrollTo(0, 0);
    } else {
      S.bienvenida = true;
      UI.paso = 0;
      UI.pestana = 'cobros';
      guardar();
      dibujar();
      window.scrollTo(0, 0);
    }
    return;
  }

  if (accion === 'pasoAtras') {
    UI.paso = Math.max(0, UI.paso - 1);
    dibujar();
    window.scrollTo(0, 0);
    return;
  }

  if (accion === 'verIntroduccion') {
    S.bienvenida = false;
    UI.paso = 0;
    dibujar();
    window.scrollTo(0, 0);
    return;
  }

  /* Modales y Operaciones */
  if (accion === 'modalNuevoPrestamo') modalNuevoPrestamo();
  if (accion === 'modalNuevoCliente') modalNuevoCliente();
  if (accion === 'nuevoPrestamoPara') modalNuevoPrestamo(+btn.dataset.id);

  if (accion === 'crearPrestamoConfirmado') {
    const cliId = +document.getElementById('pCliente').value;
    const monto = aNumero(document.getElementById('pMonto').value);
    const tasa = aNumero(document.getElementById('pTasa').value);
    const frec = document.getElementById('pFrecuencia').value;
    const cuotas = parseInt(document.getElementById('pCuotas').value) || 1;
    const fecha = document.getElementById('pFecha').value || hoyISO();
    const finde = document.getElementById('pFinde').checked;

    if (!monto || monto <= 0) { aviso('Ingrese un monto válido.'); return; }

    const totalDevolver = Math.round(monto * (1 + tasa / 100));
    const nuevoP = {
      id: Date.now(),
      clienteId: cliId,
      montoPrestado: monto,
      tasa: tasa,
      totalDevolver: totalDevolver,
      frecuencia: frec,
      numCuotas: cuotas,
      fechaInicio: fecha,
      incluyeFinde: finde
    };
    nuevoP.plan = generarCuotas(nuevoP);

    S.prestamos.push(nuevoP);
    guardar();
    cerrarModal();
    dibujar();
    aviso('Préstamo creado con éxito.');
  }

  if (accion === 'guardarClienteConfirmado') {
    const n = document.getElementById('cNombre').value.trim();
    if (!n) { aviso('El nombre es obligatorio.'); return; }
    S.clientes.push({
      id: Date.now(),
      n,
      tel: document.getElementById('cTel').value.trim(),
      dni: document.getElementById('cDni').value.trim(),
      dir: document.getElementById('cDir').value.trim(),
      zona: document.getElementById('cZona').value.trim()
    });
    guardar();
    cerrarModal();
    dibujar();
    aviso('Cliente guardado.');
  }

  if (accion === 'cobrarCuota') {
    registrarCobro(+btn.dataset.p, +btn.dataset.c, +btn.dataset.m);
  }

  if (accion === 'cobroParcial') {
    const saldo = +btn.dataset.saldo;
    const pid = +btn.dataset.p;
    const cid = +btn.dataset.c;
    abrirModal(`
      <h2>Registrar Pago Parcial</h2>
      <label>Monto recibido (Saldo pendiente: ${pesos(saldo)})</label>
      <input type="text" id="montoParcial" value="${saldo}" inputmode="decimal">
      <div class="f" style="margin-top:14px">
        <button class="sec" onclick="cerrarModal()">Cancelar</button>
        <button onclick="const m = aNumero(document.getElementById('montoParcial').value); if(m>0){ registrarCobro(${pid}, ${cid}, m); }">Confirmar Cobro</button>
      </div>
    `);
  }

  if (accion === 'verPlan') modalPlanCuotas(+btn.dataset.id);

  if (accion === 'recordarWp') {
    const tel = btn.dataset.tel.replace(/\D/g, '');
    const cli = btn.dataset.cli;
    const m = btn.dataset.m;
    const texto = encodeURIComponent(`Hola ${cli}, te recordamos desde ${S.nombreNegocio} que hoy vence tu cuota de ${pesos(m)}. Saludos!`);
    window.open(`https://wa.me/${tel}?text=${texto}`, '_blank');
  }

  if (accion === 'guardarCajaBase') {
    S.cajaInicial = aNumero(document.getElementById('cajaBase').value);
    guardar();
    dibujar();
    aviso('Caja base actualizada.');
  }

  if (accion === 'registrarMovimiento') {
    const tipo = document.getElementById('movTipo').value;
    const monto = aNumero(document.getElementById('movMonto').value);
    const nota = document.getElementById('movNota').value.trim();
    if (!monto) { aviso('Ingrese un monto válido.'); return; }
    S.movimientosCaja.push({ id: Date.now(), tipo, monto, nota, fecha: hoyISO() });
    guardar();
    dibujar();
    aviso('Movimiento guardado.');
  }

  if (accion === 'guardarNombreNegocio') {
    S.nombreNegocio = document.getElementById('cfgNegocio').value.trim() || 'Mis Préstamos';
    guardar();
    aviso('Nombre guardado.');
  }

  if (accion === 'exportarExcel') generarExcelPréstamos();

  if (accion === 'descargarBackup') {
    descargarArchivo('copia_prestamos_' + hoyISO() + '.json', JSON.stringify(S, null, 2), 'application/json');
  }

  if (accion === 'abrirRestaurar') {
    document.getElementById('archivoBackup').click();
  }
});

document.getElementById('archivoBackup').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (data && data.prestamos && data.clientes) {
        S = data;
        S.bienvenida = true;
        guardar();
        dibujar();
        aviso('Datos restaurados correctamente.');
      } else throw new Error();
    } catch (_) {
      aviso('Archivo de copia no válido.');
    }
  };
  reader.readAsText(file);
});

document.getElementById('fab').addEventListener('click', () => modalNuevoPrestamo());

/* =====================================================================
   10 · ARRANQUE
   ===================================================================== */
dibujar();
</script>
</body>
</html>
