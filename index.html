<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis préstamos</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#1E5FA8">
<style>
:root{--bg:#F5F1EB;--bg-soft:#EDE8E0;--card:#fff;--tx:#1A1F1C;--mut:#6B756F;--ac:#1E5FA8;--ac-soft:color-mix(in srgb,var(--ac) 14%,var(--bg));--acx:#fff;--ok:#1B6B4A;--warn:#B86E1E;--bad:#C23B3B;--bd:#E5DFD6;--shadow:0 4px 24px rgba(26,31,28,.06),0 1px 3px rgba(26,31,28,.04);--glass:rgba(255,255,255,.74);--radius:22px;--radius-sm:12px;--font-display:'Fraunces',Georgia,serif;--font-body:'Outfit',system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121614;--bg-soft:#1C221F;--card:#1A211D;--tx:#F0F2F0;--mut:#9AA59D;--ok:#3D9B6E;--warn:#E09A3E;--bad:#E86A6A;--bd:#2A332E;--shadow:0 4px 24px rgba(0,0,0,.25);--glass:rgba(26,33,29,.74)}}
:root[data-theme="dark"]{--bg:#121614;--bg-soft:#1C221F;--card:#1A211D;--tx:#F0F2F0;--mut:#9AA59D;--ok:#3D9B6E;--warn:#E09A3E;--bad:#E86A6A;--bd:#2A332E;--shadow:0 4px 24px rgba(0,0,0,.25);--glass:rgba(26,33,29,.74)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--tx);font:16px/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 10% -10%,rgba(30,95,168,.08),transparent),radial-gradient(ellipse 60% 40% at 100% 0%,rgba(184,110,30,.05),transparent);pointer-events:none;z-index:0}
body::after{content:'';position:fixed;left:0;right:0;bottom:0;height:120px;background:linear-gradient(to top,var(--bg) 25%,transparent);pointer-events:none;z-index:5}
body.teclado nav,body.teclado .fab,body.teclado::after{display:none}
main{position:relative;z-index:1;max-width:440px;margin:0 auto;padding:20px 20px 150px}
.card{background:var(--card);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--bd)}
.mut{color:var(--mut);font-size:.9375rem}.ok{color:var(--ok)}.neg{color:var(--bad)}.warn{color:var(--warn)}
.num{font-family:var(--font-display);font-size:2.5rem;font-weight:800;letter-spacing:-.03em;color:var(--ok);line-height:1.05;margin:0}
.num.warn{color:var(--warn)}
.toast{position:fixed;left:14px;right:14px;bottom:calc(104px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:12px 14px;border-radius:12px;font-weight:600;z-index:30}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border-bottom:0}.row b{font-weight:600}
input,select{font-family:var(--font-body);font-size:1rem;color:var(--tx);background:var(--bg);border:1.5px solid var(--bd);border-radius:var(--radius-sm);padding:12px 14px;min-width:0;width:100%;outline:none;transition:border-color .15s}
input:focus,select:focus{border-color:var(--ac)}
button{font-family:var(--font-body);font-size:.9375rem;font-weight:600;border:0;border-radius:999px;padding:13px 22px;background:var(--ac);color:var(--acx);cursor:pointer;transition:transform .15s ease}
button:active{transform:scale(.97)}
button.sec{background:transparent;color:var(--ac);border:1.5px solid var(--bd)}
button.x{background:transparent;color:var(--mut);padding:8px 12px;border-radius:8px}
button.mini{padding:6px 14px;font-size:.8125rem;margin-top:4px}
.bt{display:inline-flex;align-items:center;border:1.5px solid var(--bd);border-radius:999px;padding:11px 16px;font-weight:600;text-decoration:none}
.bt.wa{color:#25D366;border-color:#25D366}
.f{display:flex;gap:8px;margin-bottom:10px;align-items:center}
h2{font-size:1.05rem;margin:0 0 10px;font-weight:700}
label{display:block;font-size:.8125rem;font-weight:500;color:var(--mut);margin:10px 0 4px}
nav{position:fixed;left:12px;right:12px;margin:0 auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:416px;display:flex;padding:6px;gap:2px;border:1px solid var(--bd);border-radius:32px;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 10px 30px rgba(26,31,28,.16);z-index:10}
nav button{flex:1;background:transparent;color:var(--mut);border-radius:26px;padding:12px 2px;font-size:.8125rem;font-weight:500}
nav button.on{background:var(--ac-soft);color:var(--ac)}
.fab{position:fixed;right:18px;bottom:calc(92px + env(safe-area-inset-bottom,0px));width:64px;height:64px;padding:0;border-radius:50%;font-size:2rem;font-weight:400;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.28);z-index:11}
.chip{border-radius:999px;padding:8px 14px;font-size:.8125rem;background:var(--bg-soft);color:var(--tx);font-weight:600}
.chip.on{background:var(--ac);color:var(--acx)}
.hero-fila{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 8px}
.anillo{flex:none;position:relative;width:92px;height:92px}
.anillo svg{width:92px;height:92px;transform:rotate(-90deg)}
.anillo b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.95rem}
.kchip{display:inline-flex;flex:none;width:34px;height:34px;border-radius:12px;align-items:center;justify-content:center;margin-right:10px;font-style:normal;font-weight:700;background:color-mix(in srgb,var(--kc) 20%,transparent);color:var(--kc)}
.k0{--kc:#E8833A}.k1{--kc:#3B82C4}.k2{--kc:#3D9B6E}.k3{--kc:#B35BC4}.k4{--kc:#D9534F}
.copyright{text-align:center;font-size:12px;color:var(--mut);margin:18px 0 8px;opacity:.85}
body.sin-degradado::after{display:none}
body.pv #m,body.pv nav{filter:blur(16px)}
.serif{font-family:var(--font-display);font-weight:700;letter-spacing:-.02em;line-height:1.15}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:32px 8px 24px;min-height:58vh;justify-content:center}
.moneda{width:88px;height:88px;border-radius:28px;background:var(--ac-soft);display:flex;align-items:center;justify-content:center;font-size:42px;margin-bottom:28px;box-shadow:0 8px 32px rgba(30,95,168,.14)}
.hero-t{font-size:clamp(2rem,7vw,2.6rem);font-weight:800;margin:0 0 6px;letter-spacing:-.03em}
.hero-s{font-size:1.35rem;font-weight:600;color:var(--ac);margin:0 0 16px}
.hero-p{color:var(--mut);font-size:1.05rem;max-width:280px;margin:0 0 28px}
.paso{flex:none;width:32px;height:32px;border-radius:50%;background:var(--ac);color:var(--acx);font-weight:700;font-size:.875rem;display:flex;align-items:center;justify-content:center}
.resultado{margin-top:12px;font-family:var(--font-display);font-size:2.75rem;font-weight:800;color:var(--ok);text-align:center;line-height:1}
.resultado span{font-size:1rem;font-weight:500;color:var(--mut);display:block;margin-top:4px}
.importar{width:100%;max-width:340px;margin-top:18px;padding:14px;border-radius:var(--radius);background:var(--ac-soft);border:1.5px dashed var(--ac);text-align:left}
.importar-fila{display:flex;align-items:center;gap:12px}
.importar-icono{flex:none;width:42px;height:42px;border-radius:12px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:20px}
.importar-txt{display:flex;flex-direction:column;font-size:.92rem;line-height:1.3}.importar-txt span{color:var(--mut)}
.progreso{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 14px}
.puntos{display:flex;gap:6px}.puntos span{width:26px;height:6px;border-radius:999px;background:var(--bd)}
.puntos .hecho{background:var(--ac);opacity:.5}.puntos .actual{background:var(--ac)}
.pie{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--bd);z-index:10;max-width:440px;margin:0 auto}
.pie button{min-width:120px}
.bt.mini{padding:5px 12px;font-size:.8125rem;margin-top:4px}
button.x.mini{padding:5px 10px;border:1.5px dashed var(--bd)}
.acc{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
</style></head><body>
<main id="m"></main>
<nav><button data-t="hoy">Hoy</button><button data-t="clientes">Clientes</button><button data-t="prestamos">Préstamos</button><button data-t="caja">Caja</button><button data-t="ajustes">Ajustes</button></nav>
<button id="fab" class="fab" aria-label="Nuevo préstamo" data-a="nuevoPrest">＋</button>
<script>
const KEY='prestamos_v1',MS=864e5,VERSION='1.3.0';
const AUTOR='Martín Enrique Bustos',AUTOR_EMAIL='bustosmartin181@gmail.com',AUTOR_WA='5492612168515';
const pieCopyright=()=>`<div class="copyright">© 2026 ${AUTOR}</div>`;
const $=id=>document.getElementById(id);
const d2=n=>String(n).padStart(2,'0');
const pesos=n=>(Math.round(n)<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString('es-AR');
const num=v=>{let s=String(v).trim();if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(!/^\d+\.\d{1,2}$/.test(s))s=s.replace(/\./g,'');return +s.replace(/[^\d.-]/g, '')||0};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dn=iso=>{const[a,m,d]=iso.split('-').map(Number);return Date.UTC(a,m-1,d)/MS};
const di=n=>new Date(n*MS).toISOString().slice(0,10);
const hoyISO=()=>{const d=new Date();return d.getFullYear()+'-'+d2(d.getMonth()+1)+'-'+d2(d.getDate())};
const fmt=iso=>iso.slice(8)+'/'+iso.slice(5,7);
function sumaMeses(iso,k){const[a,m,d]=iso.split('-').map(Number);const t=new Date(Date.UTC(a,m-1+k,1));const u=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).getUTCDate();return new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth(),Math.min(d,u))).toISOString().slice(0,10)}
const PASO={semanal:7,quincenal:15};
function vencDiario(p,k){let d=dn(p.fecha),n=0;while(n<k){d++;const w=new Date(d*MS).getUTCDay();if(p.finde||(w!==0&&w!==6))n++}return di(d)}
const venc=(p,k)=>p.frec==='diario'?vencDiario(p,k):p.frec==='mensual'?sumaMeses(p.fecha,k):di(dn(p.fecha)+PASO[p.frec]*k);
const fechaL=iso=>iso.slice(8)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4);

/* ---------- Datos (se guardan solo en este teléfono) ---------- */
const BASE=()=>({nombre:'',tema:'auto',color:'azul',clientes:[],prestamos:[],pagos:[],sid:1,ultimaCopia:0,cajaInicial:0,movs:[],negocio:''});
let datosRotos=false;
function cargar(){let g=null,raw=null;try{raw=localStorage.getItem(KEY);g=JSON.parse(raw)}catch(_){}
  if(raw&&(!g||!Array.isArray(g.clientes)||!Array.isArray(g.prestamos)||!Array.isArray(g.pagos))){try{localStorage.setItem(KEY+'_roto',raw)}catch(_){}datosRotos=true;g=null}
  return Object.assign(BASE(),g||{})}
let S=cargar(),tab='hoy',bloqueada=!!S.pin;
const UI={paso:0};
let tg;const guardar=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(_){}clearTimeout(tg);tg=setTimeout(reprogramar,900)};
const nid=()=>S.sid++;
const cli=id=>S.clientes.find(c=>c.id===id)||{n:'(cliente borrado)',tel:'',id:0};

/* ---------- Cuentas de cada préstamo ---------- */
function info(p,hoy){
  const total=p.monto*(1+p.interes/100),cuota=total/p.cuotas;
  const pagado=S.pagos.filter(x=>x.pid===p.id).reduce((t,x)=>t+x.monto,0);
  const saldo=Math.max(0,total-pagado);
  let k=0;while(k<p.cuotas&&venc(p,k+1)<=hoy)k++;
  let atraso=Math.min(total,cuota*k)-pagado;if(atraso<.5)atraso=0;
  const n=Math.floor((pagado+.5)/cuota),sig=n<p.cuotas?n+1:0;
  const falta=sig?Math.min(saldo,sig*cuota-pagado):0,fv=sig?venc(p,sig):'';
  const estado=saldo<.5?'pagado':atraso>0?'atrasado':'aldia';
  return{total,cuota,pagado,saldo,atraso,sig,falta,fv,estado};
}
const EST={pagado:['Pagado','ok'],aldia:['Al día','ok'],atrasado:['Atrasado','neg']};
const diasTxt=d=>d<=0?'vence hoy':'atrasada '+d+(d===1?' día':' días');

/* ---------- Tema ---------- */
const PAL={azul:['#1E5FA8','#5AA7F5','#fff','#08121f'],verde:['#1B6B4A','#3D9B6E','#fff','#0A120E'],violeta:['#6d3fc0','#b794f6','#fff','#1a0b33'],naranja:['#c2570c','#fb923c','#fff','#2b1100'],rojo:['#b42318','#f87171','#fff','#2a0a08']};
function aplicarTema(){const r=document.documentElement,t=S.tema||'auto';
  if(t==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',t==='oscuro'?'dark':'light');
  const osc=t==='oscuro'||(t==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches),p=PAL[S.color]||PAL.azul;
  r.style.setProperty('--ac',osc?p[1]:p[0]);r.style.setProperty('--acx',osc?p[3]:p[2])}

/* ---------- Ventanas y avisos ---------- */
function aviso(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),4500)}
const cerrarModal=()=>document.querySelectorAll('.modal').forEach(x=>x.remove());
function modal(html,w,keep){if(!keep)cerrarModal();const f=document.createElement('div');f.className='modal';
  f.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:'+(keep?25:20)+';padding:20px';
  f.innerHTML='<div class="card" style="width:100%;max-width:'+(w||380)+'px;margin:0;max-height:88vh;overflow:auto">'+html+'</div>';
  f.onclick=e=>{if(e.target===f)f.remove()};document.body.appendChild(f);return f}
function confirmar(msg){return new Promise(r=>{const f=modal('<div id="cm" style="margin-bottom:14px"></div><div class="f" style="justify-content:flex-end;margin:0"><button class="sec" id="cno">Cancelar</button><button id="csi">Aceptar</button></div>',340,true);
  f.querySelector('#cm').textContent=msg;f.querySelector('#csi').onclick=()=>{f.remove();r(true)};f.querySelector('#cno').onclick=()=>{f.remove();r(false)}})}
const fin=()=>{guardar();cerrarModal();dibujar()};
const saludo=h=>h<6?'Buenas noches':h<13?'Buen día':h<20?'Buenas tardes':'Buenas noches';
const fd=(a,b)=>`<div class="row"><span>${a}</span><b>${b}</b></div>`;

/* ---------- Pantallas ---------- */
const chipC=c=>`<i class="kchip k${(c.id||0)%5}">${esc((c.n||'?')[0].toUpperCase())}</i>`;
const fila=(c,sub,der,btn,acc)=>`<div class="row" ${acc||''}><span style="display:flex;align-items:center;min-width:0">${chipC(c)}<span><b>${esc(c.n)}</b><br><span class="mut" style="font-size:.8125rem">${sub}</span></span></span><span style="text-align:right;flex:none"><b>${der}</b>${btn?'<br>'+btn:''}</span></div>`;
function anillo(pct,color){const L=2*Math.PI*38;return `<div class="anillo"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" fill="none" stroke="var(--bd)" stroke-width="10"/><circle cx="50" cy="50" r="38" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(L*Math.min(100,pct)/100).toFixed(1)} ${L.toFixed(1)}"/></svg><b>${Math.round(pct)}%</b></div>`}

function waNum(t){let d=(t||'').replace(/\D/g,'').replace(/^0+/,'');if(d.startsWith('54')){if(d.length===12)d='549'+d.slice(2);return d}return d.length===10?'549'+d:d}
const wa=(c,msg)=>waNum(c.tel)?`<a class="bt wa mini" target="_blank" rel="noopener" href="https://wa.me/${waNum(c.tel)}?text=${encodeURIComponent(msg)}">WhatsApp</a>`:(c.id?`<button class="x mini" data-a="editCli" data-id="${c.id}">+ Teléfono</button>`:'');
const acc=(...x)=>`<span class="acc">${x.join('')}</span>`;
const msgAtr=(x,hoy)=>`Hola ${x.c.n}, te escribo por la cuota ${x.i.sig} de ${pesos(x.i.atraso)} que ${dn(hoy)-dn(x.i.fv)<=0?'vence hoy':'venció el '+fmt(x.i.fv)}. ¿Cuándo podés pasar o transferir? ¡Gracias!`;
const msgProx=x=>`Hola ${x.c.n}, te recuerdo que el ${fmt(x.i.fv)} vence la cuota ${x.i.sig} de ${pesos(x.i.falta)}. ¡Gracias!`;
const AV_BASE=9000;
function reprogramar(){if(S.avisosOn)programarAvisos(false)}
async function programarAvisos(pedir){const P=window.Capacitor&&window.Capacitor.Plugins,ln=P&&P.LocalNotifications;if(!ln)return false;
  try{const pend=await ln.getPending(),ids=(pend.notifications||[]).filter(n=>n.id>=AV_BASE).map(n=>({id:n.id}));if(ids.length)await ln.cancel({notifications:ids});
    if(!S.avisosOn)return true;
    let pm=await ln.checkPermissions();if(pm.display!=='granted'&&pedir)pm=await ln.requestPermissions();if(pm.display!=='granted')return 'permiso';
    const[hh,mm]=(S.avisosHora||'09:00').split(':').map(Number),hoy=hoyISO(),ahora=Date.now(),lista=[];
    S.prestamos.forEach(p=>{const i=info(p,hoy),c=cli(p.cid);for(let k=i.sig;k>=1&&k<=p.cuotas;k++){const v=venc(p,k);if(dn(v)-dn(hoy)>30)break;
      [[-1,'Mañana vence'],[0,'Hoy vence']].forEach(([d,t])=>{const[a,m,dd]=di(dn(v)+d).split('-').map(Number),at=new Date(a,m-1,dd,hh,mm);
        if(at.getTime()>ahora)lista.push({at,title:'Cobro: '+c.n,body:t+' la cuota '+k+' de '+c.n+': '+pesos(i.cuota)})})}});
    lista.sort((x,y)=>x.at-y.at);let id=AV_BASE;
    const nots=lista.slice(0,60).map(n=>({id:id++,title:n.title,body:n.body,schedule:{at:n.at,allowWhileIdle:true}}));
    if(nots.length)await ln.schedule({notifications:nots});return true}catch(_){return false}}
function pHoy(){
  const hoy=hoyISO(),L=S.prestamos.map(p=>({p,c:cli(p.cid),i:info(p,hoy)})),act=L.filter(x=>x.i.estado!=='pagado');
  const atr=act.filter(x=>x.i.estado==='atrasado').sort((a,b)=>a.i.fv<b.i.fv?-1:1),aCobrar=atr.reduce((t,x)=>t+x.i.atraso,0);
  const prox=act.filter(x=>x.i.estado==='aldia'&&dn(x.i.fv)-dn(hoy)<=7).sort((a,b)=>a.i.fv<b.i.fv?-1:1);
  const calle=act.reduce((t,x)=>t+x.i.saldo,0),mes=hoy.slice(0,7),cobMes=S.pagos.filter(x=>x.fecha.slice(0,7)===mes).reduce((t,x)=>t+x.monto,0);
  const tot=L.reduce((t,x)=>t+x.i.total,0),pag=L.reduce((t,x)=>t+x.i.pagado,0),pct=tot>0?pag/tot*100:0;
  let h=`<div style="margin:4px 2px 12px"><div style="font-size:20px;font-weight:700">${saludo(new Date().getHours())}${S.nombre?', '+esc(S.nombre):''}</div><div class="mut">${atr.length?'Tenés '+atr.length+(atr.length>1?' cobros':' cobro')+' para hoy.':'No hay cobros pendientes hoy.'}${(m=>m?' Mañana vence'+(m>1?'n ':' ')+m+' cuota'+(m>1?'s':'')+'.':'')(prox.filter(x=>dn(x.i.fv)-dn(hoy)===1).length)}</div></div>`;
  if(!S.clientes.length)h+='<div class="card mut">Primero cargá a tus clientes en la pestaña Clientes. Después anotá cada préstamo con el botón ＋.</div>';
  h+=`<div class="card"><div class="mut">Para cobrar hoy</div><div class="hero-fila"><div class="num ${aCobrar>0?'warn':''}">${pesos(aCobrar)}</div>${anillo(pct,aCobrar>0?'var(--warn)':'var(--ok)')}</div><div class="mut">Ya cobraste el ${Math.round(pct)}% de lo que te tienen que devolver en total.</div></div>`;

  return h;
}
