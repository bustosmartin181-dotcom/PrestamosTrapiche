<style>
:root{--bg:#F5F1EB;--bg-soft:#EDE8E0;--card:#fff;--tx:#1A1F1C;--mut:#6B756F;--ac:#1E5FA8;--ac-soft:color-mix(in srgb,var(--ac) 14%,var(--bg));--acx:#fff;--ok:#1B6B4A;--warn:#B86E1E;--bad:#C23B3B;--bd:#E5DFD6;--shadow:0 4px 24px rgba(26,31,28,.06),0 1px 3px rgba(26,31,28,.04);--glass:rgba(255,255,255,.74);--radius:22px;--radius-sm:12px;--font-display:'Fraunces',Georgia,serif;--font-body:'Outfit',system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121614;--bg-soft:#1C221F;--card:#1A211D;--tx:#F0F2F0;--mut:#9AA59D;--ok:#3D9B6E;--warn:#E09A3E;--bad:#E86A6A;--bd:#2A332E;--shadow:0 4px 24px rgba(0,0,0,.25);--glass:rgba(26,33,29,.74)}}
:root[data-theme="dark"]{--bg:#121614;--bg-soft:#1C221F;--card:#1A211D;--tx:#F0F2F0;--mut:#9AA59D;--ok:#3D9B6E;--warn:#E09A3E;--bad:#E86A6A;--bd:#2A332E;--shadow:0 4px 24px rgba(0,0,0,.25);--glass:rgba(26,33,29,.74)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}

body.teclado nav,body.teclado .fab,body.teclado::after{display:none}

.card{background:var(--card);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--bd)}

.row:last-child{border-bottom:0}.row b{font-weight:600}
input,select{font-family:var(--font-body);font-size:1rem;color:var(--tx);background:var(--bg);border:1.5px solid var(--bd);border-radius:var(--radius-sm);padding:12px 14px;min-width:0;width:100%;outline:none;transition:border-color .15s}
input:focus,select:focus{border-color:var(--ac)}
button{font-family:var(--font-body);font-size:.9375rem;font-weight:600;border:0;border-radius:999px;padding:13px 22px;background:var(--ac);color:var(--acx);cursor:pointer;transition:transform .15s ease}
button:active{transform:scale(.97)}
button.sec{background:transparent;color:var(--ac);border:1.5px solid var(--bd)}
button.x{background:transparent;color:var(--mut);padding:8px 12px;border-radius:8px}

.bt{display:inline-flex;align-items:center;border:1.5px solid var(--bd);border-radius:999px;padding:11px 16px;font-weight:600;text-decoration:none}
.bt.wa{color:#25D366;border-color:#25D366}
.f{display:flex;gap:8px;margin-bottom:10px;align-items:center}
h2{font-size:1.05rem;margin:0 0 10px;font-weight:700}
label{display:block;font-size:.8125rem;font-weight:500;color:var(--mut);margin:10px 0 4px}
nav{position:fixed;left:12px;right:12px;margin:0 auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:416px;display:flex;padding:6px;gap:2px;border:1px solid var(--bd);border-radius:32px;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 10px 30px rgba(26,31,28,.16);z-index:10}

.fab{position:fixed;right:18px;bottom:calc(92px + env(safe-area-inset-bottom,0px));width:64px;height:64px;padding:0;border-radius:50%;font-size:2rem;font-weight:400;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.28);z-index:11}
.chip{border-radius:999px;padding:8px 14px;font-size:.8125rem;background:var(--bg-soft);color:var(--tx);font-weight:600}
.chip.on{background:var(--ac);color:var(--acx)}
.hero-fila{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 8px}
.anillo{flex:none;position:relative;width:92px;height:92px}
.anillo svg{width:92px;height:92px;transform:rotate(-90deg)}
.anillo b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.95rem}
.kchip{display:inline-flex;flex:none;width:34px;height:34px;border-radius:12px;align-items:center;justify-content:center;margin-right:10px;font-style:normal;font-weight:700;background:color-mix(in srgb,var(--kc) 20%,transparent);color:var(--kc)}
.k0{--kc:#E8833A}.k1{--kc:#3B82C4}.k2{--kc:#3D9B6E}.k3{--kc:#B35BC4}.k4{--kc:#D9534F}
.copyright{text-align:center;font-size:12px;color:var(--mut);margin:18px 0 8px;opacity:.85}
body.sin-degradado::after{display:none}
body.pv #m,body.pv nav{filter:blur(16px)}
.serif{font-family:var(--font-display);font-weight:700;letter-spacing:-.02em;line-height:1.15}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:32px 8px 24px;min-height:58vh;justify-content:center}
.moneda{width:88px;height:88px;border-radius:28px;background:var(--ac-soft);display:flex;align-items:center;justify-content:center;font-size:42px;margin-bottom:28px;box-shadow:0 8px 32px rgba(30,95,168,.14)}
.hero-t{font-size:clamp(2rem,7vw,2.6rem);font-weight:800;margin:0 0 6px;letter-spacing:-.03em}
.hero-s{font-size:1.35rem;font-weight:600;color:var(--ac);margin:0 0 16px}
.hero-p{color:var(--mut);font-size:1.05rem;max-width:280px;margin:0 0 28px}
.paso{flex:none;width:32px;height:32px;border-radius:50%;background:var(--ac);color:var(--acx);font-weight:700;font-size:.875rem;display:flex;align-items:center;justify-content:center}
.resultado{margin-top:12px;font-family:var(--font-display);font-size:2.75rem;font-weight:800;color:var(--ok);text-align:center;line-height:1}
.resultado span{font-size:1rem;font-weight:500;color:var(--mut);display:block;margin-top:4px}
.importar{width:100%;max-width:340px;margin-top:18px;padding:14px;border-radius:var(--radius);background:var(--ac-soft);border:1.5px dashed var(--ac);text-align:left}
.importar-fila{display:flex;align-items:center;gap:12px}
.importar-icono{flex:none;width:42px;height:42px;border-radius:12px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:20px}
.importar-txt{display:flex;flex-direction:column;font-size:.92rem;line-height:1.3}.importar-txt span{color:var(--mut)}
.progreso{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 14px}
.puntos{display:flex;gap:6px}.puntos span{width:26px;height:6px;border-radius:999px;background:var(--bd)}
.puntos .hecho{background:var(--ac);opacity:.5}.puntos .actual{background:var(--ac)}
.pie{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--bd);z-index:10;max-width:440px;margin:0 auto}
.pie button{min-width:120px}
.bt.mini{padding:5px 12px;font-size:.8125rem;margin-top:4px}
button.x.mini{padding:5px 10px;border:1.5px dashed var(--bd)}
.acc{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
@keyframes neonGlow{0%,100%{box-shadow:0 0 14px rgba(245,158,11,.3),0 0 28px rgba(30,95,168,.18);border-color:rgba(245,158,11,.65)}50%{box-shadow:0 0 24px rgba(245,158,11,.55),0 0 44px rgba(30,95,168,.35);border-color:rgba(251,191,36,.95)}}
.cartel-iluminado{box-shadow:0 0 18px rgba(245,158,11,.35);background:linear-gradient(135deg,rgba(255,255,255,.96),rgba(254,243,199,.88));border:1.8px solid rgba(245,158,11,.8);border-radius:var(--radius);padding:16px;margin-bottom:14px;position:relative;overflow:hidden;transition:opacity .35s ease,transform .35s ease}
:root[data-theme="dark"] .cartel-iluminado{background:linear-gradient(135deg,rgba(30,36,33,.96),rgba(45,34,18,.92))}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .cartel-iluminado{background:linear-gradient(135deg,rgba(30,36,33,.96),rgba(45,34,18,.92))}}
body.teclado .pill-donar{display:none!important}
.pill-donar{position:fixed;bottom:92px;left:18px;background:var(--card);border:1.5px solid rgba(245,158,11,.8);box-shadow:0 4px 18px rgba(245,158,11,.3);border-radius:999px;padding:8px 14px;font-size:.8125rem;font-weight:700;display:flex;align-items:center;gap:6px;z-index:11;cursor:pointer}
.timer-bar{height:5px;background:rgba(245,158,11,.2);border-radius:999px;overflow:hidden;margin-top:10px}
.timer-prog{height:100%;background:linear-gradient(90deg,#f59e0b,#fbbf24);width:100%;transition:width 1s linear}
</style></head><body>
<main id="m"><div style="padding:38vh 20px 0;text-align:center;color:var(--mut)">Cargando Mis préstamos…</div></main>
<nav><button data-t="hoy">Hoy</button><button data-t="clientes">Clientes</button><button data-t="prestamos">Préstamos</button><button data-t="caja">Caja</button><button data-t="ajustes">Ajustes</button></nav>

<script>
window.addEventListener('error',function(e){var m=document.getElementById('m');if(m&&!window.__ok)m.innerHTML='<div style="padding:30px 20px"><b>Algo salió mal al abrir la app</b><br><br>'+String(e.message||e).replace(/</g,'&lt;')+'<br><br><small>Sacale una captura y mandásela a Claude.</small></div>'});
window.addEventListener('unhandledrejection',function(e){console.error(e.reason)});

<script>
const KEY='prestamos_v1',MS=864e5,VERSION='1.3.2';
const AUTOR='Martín Enrique Bustos',AUTOR_EMAIL='bustosmartin181@gmail.com',AUTOR_WA='5492612168515',AUTOR_ALIAS='MartinchoLujanino';
const pieCopyright=()=>`<div class="copyright">© 2026 ${AUTOR}</div>`;
const $=id=>document.getElementById(id);
const d2=n=>String(n).padStart(2,'0');
const pesos=n=>(Math.round(n)<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString('es-AR');
const num=v=>{let s=String(v).trim();if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(!/^\d+\.\d{1,2}$/.test(s))s=s.replace(/\./g,'');return +s.replace(/[^\d.-]/g,'')||0};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dn=iso=>{const[a,m,d]=iso.split('-').map(Number);return Date.UTC(a,m-1,d)/MS};
const di=n=>new Date(n*MS).toISOString().slice(0,10);
const hoyISO=()=>{const d=new Date();return d.getFullYear()+'-'+d2(d.getMonth()+1)+'-'+d2(d.getDate())};
const fmt=iso=>iso.slice(8)+'/'+iso.slice(5,7);
function sumaMeses(iso,k){const[a,m,d]=iso.split('-').map(Number);const t=new Date(Date.UTC(a,m-1+k,1));const u=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).getUTCDate();return new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth(),Math.min(d,u))).toISOString().slice(0,10)}
const PASO={semanal:7,quincenal:15};
function vencDiario(p,k){let d=dn(p.fecha),n=0;while(n<k){d++;const w=new Date(d*MS).getUTCDay();if(p.finde||(w!==0&&w!==6))n++}return di(d)}
const venc=(p,k)=>p.frec==='diario'?vencDiario(p,k):p.frec==='mensual'?sumaMeses(p.fecha,k):di(dn(p.fecha)+PASO[p.frec]*k);
const fechaL=iso=>iso.slice(8)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4);

/* ---------- Datos (se guardan solo en este teléfono) ---------- */
const BASE=()=>({nombre:'',tema:'auto',color:'azul',clientes:[],prestamos:[],pagos:[],sid:1,ultimaCopia:0,cajaInicial:0,movs:[],negocio:''});
let datosRotos=false;
function cargar(){let g=null,raw=null;try{raw=localStorage.getItem(KEY);g=JSON.parse(raw)}catch(_){}
  if(raw&&(!g||!Array.isArray(g.clientes)||!Array.isArray(g.prestamos)||!Array.isArray(g.pagos))){try{localStorage.setItem(KEY+'_roto',raw)}catch(_){}datosRotos=true;g=null}
  return Object.assign(BASE(),g||{})}
let S=cargar(),tab='hoy',bloqueada=!!S.pin;
const UI={paso:0};
let tg;const guardar=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(_){}clearTimeout(tg);tg=setTimeout(reprogramar,900)};
const nid=()=>S.sid++;
const cli=id=>S.clientes.find(c=>c.id===id)||{n:'(cliente borrado)',tel:'',id:0};

/* ---------- Cuentas de cada préstamo ---------- */
function info(p,hoy){
  const total=p.monto*(1+p.interes/100),cuota=total/p.cuotas;
  const pagado=S.pagos.filter(x=>x.pid===p.id).reduce((t,x)=>t+x.monto,0);
  const saldo=Math.max(0,total-pagado);
  let k=0;while(k<p.cuotas&&venc(p,k+1)<=hoy)k++;
  let atraso=Math.min(total,cuota*k)-pagado;if(atraso<.5)atraso=0;
  const n=Math.floor((pagado+.5)/cuota),sig=n<p.cuotas?n+1:0;
  const falta=sig?Math.min(saldo,sig*cuota-pagado):0,fv=sig?venc(p,sig):'';
  const estado=saldo<.5?'pagado':atraso>0?'atrasado':'aldia';
  return{total,cuota,pagado,saldo,atraso,sig,falta,fv,estado};
}
const EST={pagado:['Pagado','ok'],aldia:['Al día','ok'],atrasado:['Atrasado','neg']};
const diasTxt=d=>d<=0?'vence hoy':'atrasada '+d+(d===1?' día':' días');

/* ---------- Tema ---------- */
const PAL={azul:['#1E5FA8','#5AA7F5','#fff','#08121f'],verde:['#1B6B4A','#3D9B6E','#fff','#0A120E'],violeta:['#6d3fc0','#b794f6','#fff','#1a0b33'],naranja:['#c2570c','#fb923c','#fff','#2b1100'],rojo:['#b42318','#f87171','#fff','#2a0a08']};
function aplicarTema(){const r=document.documentElement,t=S.tema||'auto';
  if(t==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',t==='oscuro'?'dark':'light');
  const osc=t==='oscuro'||(t==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches),p=PAL[S.color]||PAL.azul;
  r.style.setProperty('--ac',osc?p[1]:p[0]);r.style.setProperty('--acx',osc?p[3]:p[2])}

let timerDonacion=null,segDonacion=14,timerPausado=false,cartelYaVisto=false;
function actualizarPill(){const p=$('donarPill');if(!p)return;p.style.display=(bloqueada||!S.bienvenida||$('cartelDonacion'))?'none':'flex'}
function iniciarTimerDonacion(){clearInterval(timerDonacion);const el=$('cartelDonacion');if(!el)return;
  segDonacion=14;timerPausado=false;cartelYaVisto=true;
  timerDonacion=setInterval(()=>{if(timerPausado)return;segDonacion--;
    const tTxt=$('cdTimer'),bProg=$('cdProg');
    if(tTxt)tTxt.textContent=segDonacion+'s';
    if(bProg)bProg.style.width=((segDonacion/14)*100)+'%';
    if(segDonacion<=0){clearInterval(timerDonacion);cerrarCartelDisimulado()}
  },1000)}
function cerrarCartelDisimulado(){const c=$('cartelDonacion');if(c){c.style.opacity='0';c.style.transform='scale(0.96)';setTimeout(()=>c.remove(),350)}
  setTimeout(actualizarPill,380)}
function cartelDonacionHTML(){
  return `<div id="cartelDonacion" class="cartel-iluminado" onmouseenter="timerPausado=true" onmouseleave="timerPausado=false">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <div style="font-weight:700;font-size:.875rem;color:var(--warn)">✨ ¿Te sirve esta herramienta gratuita?</div>
      <div style="display:flex;align-items:center;gap:6px">
        <span id="cdTimer" style="font-family:monospace;font-size:11px;background:rgba(0,0,0,.08);padding:2px 6px;border-radius:10px">14s</span>
        <button class="x mini" data-a="cerrarCartel" style="padding:2px 6px">✕</button>
      </div>
    </div>
    <div class="mut" style="font-size:.84rem;line-height:1.35;margin-bottom:8px">Desarrollada por <b>${AUTOR}</b> para ordenar tus cobros sin costo ni anuncios. Podés colaborar con una donación al creador:</div>
    <div style="background:var(--card);border:1.5px solid rgba(245,158,11,.7);border-radius:12px;padding:9px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px">
      <div>
        <div style="font-size:10px;font-weight:700;color:var(--warn);text-transform:uppercase">Alias Mercado Pago / Banco:</div>
        <div style="font-family:monospace;font-weight:900;font-size:1.05rem">${AUTOR_ALIAS}</div>
      </div>
      <div style="display:flex;gap:4px">
        <button class="mini" data-a="copiarAlias" style="background:#f59e0b;color:#000;font-weight:700">Copiar</button>
        <button class="sec mini" data-a="modalDonar">Donar</button>
      </div>
    </div>
    <div class="timer-bar"><div id="cdProg" class="timer-prog"></div></div>
    <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--mut);margin-top:4px">
      <span>Se oculta disimulado (tocalo para pausar)</span>
      <span style="text-decoration:underline;cursor:pointer" data-a="cerrarCartel">Cerrar ahora</span>
    </div>
  </div>`}
function modalDonacion(){
  const waMsg=encodeURIComponent('Hola Martín! Te hice una donación a tu alias '+AUTOR_ALIAS+' por la app Mis préstamos. ¡Muchas gracias!');
  modal(`<h2>☕ Donación al Creador</h2>
  <div class="mut" style="margin-bottom:12px">Creada por <b>${AUTOR}</b>. Sin publicidad y sin suscripciones. Si te es útil podés transferirle directamente:</div>
  <div style="background:color-mix(in srgb,var(--ac) 10%,transparent);border:2px solid var(--ac);border-radius:14px;padding:12px;text-align:center;margin-bottom:14px">
    <div style="font-size:11px;font-weight:700;color:var(--mut)">ALIAS (CBU / CVU / MERCADO PAGO)</div>
    <div style="font-family:monospace;font-weight:900;font-size:1.5rem;margin:4px 0">${AUTOR_ALIAS}</div>
    <div style="font-size:11px;color:var(--mut)">Titular: ${AUTOR}</div>
    <button style="margin-top:8px;width:100%" data-a="copiarAlias">Copiar Alias (${AUTOR_ALIAS})</button>
  </div>
  <div class="f" style="flex-wrap:wrap"><a class="bt wa" target="_blank" rel="noopener" href="https://wa.me/${AUTOR_WA}?text=${waMsg}">Avisar a Martín por WhatsApp</a><button class="sec" data-a="cerrar">Cerrar</button></div>`,360)}

/* ---------- Ventanas y avisos ---------- */
function aviso(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),4500)}
const cerrarModal=()=>document.querySelectorAll('.modal').forEach(x=>x.remove());
function modal(html,w,keep){if(!keep)cerrarModal();const f=document.createElement('div');f.className='modal';
  f.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:'+(keep?25:20)+';padding:20px';

let intentos=(()=>{try{return JSON.parse(localStorage.getItem('prestamos_sec'))||{}}catch(_){return{}}})();
const gi=()=>{try{localStorage.setItem('prestamos_sec',JSON.stringify(intentos))}catch(_){}};
const espera=()=>intentos.u&&Date.now()<intentos.u?Math.ceil((intentos.u-Date.now())/1000):0;
const aHex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function hashPin(pin,sal){const tx='prestamos:'+pin,en=new TextEncoder();try{const k=await crypto.subtle.importKey('raw',en.encode(tx),'PBKDF2',false,['deriveBits']);return aHex(await crypto.subtle.deriveBits({name:'PBKDF2',salt:en.encode(sal),iterations:150000,hash:'SHA-256'},k,256))}catch(_){let h=0;for(const ch of tx+sal)h=(h*31+ch.charCodeAt(0))|0;return 'f'+h}}
const pinOk=async p=>(await hashPin(p,S.salt))===S.pin;
async function fijarPin(p){let s;try{s=aHex(crypto.getRandomValues(new Uint8Array(12)))}catch(_){s=String(Date.now())}S.salt=s;S.pin=await hashPin(p,s)}
async function probarPin(p,campo){if(espera()){aviso('Esperá '+espera()+' segundos.');return false}if(await pinOk(p)){intentos={};gi();return true}intentos.f=(intentos.f||0)+1;if(intentos.f>=5)intentos.u=Date.now()+Math.min(900,30*Math.pow(2,intentos.f-5))*1000;gi();if(campo)campo.value='';aviso('PIN incorrecto.');return false}
function pedirPin(txt){return new Promise(r=>{const m=modal(`<div style="font-weight:700;margin-bottom:10px">Ingresá tu PIN</div><input id="rp" type="password" inputmode="numeric" maxlength="8" style="text-align:center;font-size:22px;letter-spacing:6px"><div class="f" style="margin-top:12px;justify-content:center"><button id="rok">${txt||'Continuar'}</button><button class="sec" id="rno">Cancelar</button></div>`,320,true),c=m.querySelector('#rp');c.focus();const z=v=>{m.remove();r(v)};m.querySelector('#rno').onclick=()=>z(false);m.querySelector('#rok').onclick=async()=>{if(await probarPin(c.value,c))z(true)};c.onkeydown=e=>{if(e.key==='Enter')m.querySelector('#rok').click()}})}
async function opPin(op){const v=id=>($(id)||{}).value||'',fm=/^\d{4,8}$/;
  if(op==='on'){const n=v('pn');if(!fm.test(n)||n!==v('pr'))return aviso('El PIN debe tener 4 a 8 números y coincidir en los dos campos.');await fijarPin(n);guardar();aviso('PIN activado.');dibujar();return}
  if(!(await pinOk(v('pa'))))return aviso('El PIN actual no coincide.');
  if(op==='off'){delete S.pin;delete S.salt;guardar();aviso('PIN desactivado.');dibujar();return}
  const n=v('pn');if(!fm.test(n))return aviso('El PIN nuevo debe tener 4 a 8 números.');await fijarPin(n);guardar();aviso('PIN cambiado.');dibujar()}

}

    if(m<=0)return aviso('Escribí cuánto te pagó.');if(m>i.saldo+.5)return aviso('Es más de lo que debe ('+pesos(i.saldo)+').');
    const fe=$('gd').value||hoyISO();S.pagos.push({id:nid(),pid:p.id,fecha:fe,monto:m});guardar();dibujar();recibo(p,m,fe)},
  async delPago(el){if(!await confirmar('¿Borrar este pago?'))return;S.pagos=S.pagos.filter(x=>x.id!==+el.dataset.id);fin()},
  async exportar(){const d=new Date(),nombre='prestamos-'+d.getFullYear()+d2(d.getMonth()+1)+d2(d.getDate())+'.json';
    if(await descargar(nombre,JSON.stringify(S))){S.ultimaCopia=Date.now();guardar();dibujar()}}
};

document.addEventListener('click',async e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;if(!A[a])return;if(PROT.includes(a)&&S.pin&&!(await pedirPin('Continuar')))return;await A[a](el)});
document.querySelector('nav').onclick=e=>{const t=e.target.dataset.t;if(t){tab=t;dibujar();scrollTo(0,0)}};
document.addEventListener('input',e=>{if(!['pm','pi','pq'].includes(e.target.id))return;const m=num($('pm').value),i=num($('pi').value),q=Math.max(1,Math.round(num($('pq').value))),t=m*(1+i/100);
  $('pv').textContent=m>0?'Devuelve '+pesos(t)+' en '+q+' cuota'+(q>1?'s':'')+' de '+pesos(t/q):''});
document.addEventListener('focusin',e=>{if(/INPUT|SELECT/.test(e.target.tagName))document.body.classList.add('teclado')});
document.addEventListener('focusout',()=>document.body.classList.remove('teclado'));
document.addEventListener('change',async e=>{const t=e.target;
  if(t.id==='nm'){S.nombre=t.value.trim();guardar();return}
  if(t.id==='nn'){S.negocio=t.value.trim();guardar();return}
  if(t.id==='ah'){S.avisosHora=t.value||'09:00';guardar();return}
  if(t.id==='fi'&&t.files[0]){if(S.pin&&!(await pedirPin('Continuar'))){t.value='';return}const r=new FileReader();r.onload=async()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.clientes)||!Array.isArray(d.prestamos)||!Array.isArray(d.pagos))throw 0;
    if(await confirmar('Esto reemplaza todos los datos de la app por los de la copia. ¿Seguimos?')){S=Object.assign(BASE(),d);S.bienvenida=true;S.sid=Math.max(S.sid||1,...[...S.clientes,...S.prestamos,...S.pagos].map(x=>x.id+1));guardar();dibujar();aviso('Copia cargada.')}}catch(_){aviso('Ese archivo no es una copia válida.')}t.value=''};r.readAsText(t.files[0])}});
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>dibujar());
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pin')A.desbloquear()});
['click','touchstart','keydown'].forEach(ev=>document.addEventListener(ev,reinicia,{passive:true}));
document.addEventListener('visibilitychange',()=>{if(document.hidden){seg=Date.now();document.body.classList.add('pv')}else{if(S.pin&&Date.now()-seg>60000)bloquear();document.body.classList.remove('pv')}});
dibujar();reinicia();reprogramar();window.__ok=true;
if(datosRotos)aviso('Los datos guardados estaban dañados: empezamos de cero (el dato dañado quedó guardado aparte).');
</script></body></html>
